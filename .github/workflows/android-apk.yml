name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'capacitor.config.json'
      - 'package.json'

jobs:
  apk:
    # GitHub-hosted Ubuntu runners already have the Android SDK, so this is free on a
    # public repo. The APK is attached to the run as an artifact you can download and
    # sideload - no Play Store account needed.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Scaffold the Android project
        run: npx cap add android

      - name: Copy web assets into the Android project
        run: npx cap sync android

      - name: Build the debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Lannorama-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
