name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'android/**'
      - 'capacitor.config.json'
      - 'package.json'

jobs:
  apk:
    # GitHub-hosted Ubuntu runners already have the Android SDK, so this is free on a
    # public repo. The APK is attached to the run as an artifact you can download and
    # sideload - no Play Store account needed.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          # Capacitor 6 needs JDK 17 (AGP 8 requires 17, and the runner default is not
          # guaranteed to match).
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      # android/ is committed, so the platform is already scaffolded. Sync copies the web
      # assets into it and updates the Gradle plugin list.
      - name: Sync web assets into the Android project
        run: npx cap sync android

      - name: Build the debug APK
        working-directory: android
        # chmod first: the exec bit is not preserved for files committed from Windows,
        # which made this step fail with exit 126 (permission denied).
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Report APK size
        run: ls -lh android/app/build/outputs/apk/debug/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Lannorama-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
